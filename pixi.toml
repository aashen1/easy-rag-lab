[workspace]
authors = ["Ash <aashen1@foxmail.com>"]
channels = ["conda-forge"]
name = "ash-easy-rag"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[system-requirements]
cuda = "12.6"

[dependencies]
python = "3.12.*"

[pypi-dependencies]

# ==============================
# Core & Utilities
# ==============================
loguru = ">=0.7.3, <0.8"      # Logging
python-dotenv = ">=1.2.2, <2" # Environment variables
pyyaml = ">=6.0.3, <7"        # YAML parsing
tqdm = ">=4.67.3, <5"         # Progress bars

# ==============================
# LLM & Embedding Providers
# ==============================
anthropic = ">=0.95.0, <0.96"         # Anthropic Claude API
flagembedding = ">=1.3.5, <2"         # Flag embedding models
tiktoken = ">=0.12.0, <0.13"          # OpenAI token counting

# ==============================
# PyTorch & Computer Vision
# ==============================
# NOTE:
# The torch version is pinned for reproducibility in the author's environment.
# Feel free to adjust based on your platform (CPU/GPU/CUDA version).
torch = { version = "==2.6.0+cu126" }
torchvision = { version = "==0.21.0+cu126" }

# ==============================
# LlamaIndex Ecosystem
# ==============================
llama-index-core = ">=0.14.20, <0.15"         # Core RAG framework
llama-index-readers-file = ">=0.6.0, <0.7"    # File readers (PDF, etc.)
llama-index-retrievers-bm25 = ">=0.7.1, <0.8" # BM25 retriever
llama-index-vector-stores-qdrant = ">=0.10.0, <0.11" # Qdrant vector store integration
 
# ==============================
# Document Processing
# ==============================
jieba = ">=0.42.1, <0.43"      # Chinese word segmentation
pdfplumber = ">=0.11.9, <0.12" # PDF text extraction
pymupdf4llm = ">=1.27.2.2, <2" # PDF to LLM-friendly format

# ==============================
# Vector Database
# ==============================
qdrant-client = ">=1.17.1, <2" # Qdrant vector DB client

# ==============================
# Evaluation & Testing
# ==============================
pytest = ">=9.0.3, <10" # Testing framework
ragas = ">=0.4.3, <0.5" # RAG evaluation

# ==============================
# Web & Hugging Face
# ==============================
huggingface-hub = ">=1.10.2, <2"



[pypi-options]
index-url = "https://pypi.mirrors.ustc.edu.cn/simple"
extra-index-urls = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"
find-links = [
    { path = 'B:/useradmin/torch_cache' },
] # Use local torch cuda whl cache

# --- torch whl download ---
# torch official site: "https://download.pytorch.org/whl/cu126"
# alibaba mirror site: "https://mirrors.aliyun.com/pytorch-wheels/cu126"