[workspace]
authors = ["Ash (GitHub@aashen1)"]
channels = ["conda-forge"]
name = "easy-rag-lab"
platforms = ["win-64", "linux-64", "osx-arm64"]  # not tested for non-windows platforms yet
version = "0.1.17"

[system-requirements]
cuda = "12.6"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
# ==============================
# Core & Utilities
# ==============================
loguru = ">=0.7.3, <0.8"      # Logging
python-dotenv = ">=1.2.2, <2" # Environment variables
pyyaml = ">=6.0.3, <7"        # YAML parsing
tqdm = ">=4.67.3, <5"         # Progress bars
filelock = ">=3.16.1, <4"     # File locking for concurrent access
click = ">=8.3.3, <9"         # CLI framework
pydantic = ">=2.13.3, <3"     # Data validation
python-frontmatter = ">=1.1.0, <2" # Frontmatter parsing for markdown files

# ==============================
# PyTorch & Computer Vision
# ==============================

# --- torch whl download ---
# torch official site: "https://download.pytorch.org/whl/cu126"
# alibaba mirror site: "https://mirrors.aliyun.com/pytorch-wheels/cu126"
# sjtu mirror site: "https://mirror.sjtu.edu.cn/pytorch-wheels/cu126"
# nju mirror site: "https://mirrors.nju.edu.cn/pytorch/whl/cu126"
# wheel name eg: torch-2.10.0+cu126-cp312-cp312-win_amd64.whl
# nametag "manylinux" is for linux-x64 system like wsl2

# NOTE:
# The torch version is pinned for reproducibility in the author's environment.
# Feel free to adjust based on your platform (CPU/GPU/CUDA version).
# So does torch in [target.osx.pypi-dependencies]
torch = { version = "==2.10.0+cu126", index = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu126" }
torchvision = { version = "==0.25.0", index = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu126"  }
torchaudio = { version = "==2.10.0+cu126", index = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu126" }

# ==============================
# LLM & Embedding Providers
# ==============================
anthropic = ">=0.95.0, <0.96"         # Anthropic Claude API
tiktoken = ">=0.12.0, <0.13"          # OpenAI token counting
transformers = ">=5.5.4, <6"          # Hugging Face transformers for BGE models
scikit-learn = ">=1.8.0, <2"          # For BM25 retriever and evaluation metrics

# ==============================
# LlamaIndex Ecosystem
# ==============================
llama-index-core = ">=0.14.20, <0.15"         # Core RAG framework
llama-index-readers-file = ">=0.6.0, <0.7"    # File readers (PDF, etc.)
llama-index-retrievers-bm25 = ">=0.7.1, <0.8" # BM25 retriever
llama-index-vector-stores-qdrant = ">=0.10.0, <0.11" # Qdrant vector store integration

# ==============================
# Document Processing
# ==============================
jieba = ">=0.42.1, <0.43"      # Chinese word segmentation
pdfplumber = ">=0.11.9, <0.12" # PDF text extraction
pymupdf4llm = ">=1.27.2.2, <2" # PDF to LLM-friendly format

# ==============================
# Vector Database
# ==============================
qdrant-client = ">=1.17.1, <2" # Qdrant vector DB client

# ==============================
# Evaluation 
# ==============================
ragas = ">=0.4.3, <0.5" # RAG evaluation
langchain-anthropic = ">=1.4.0, <2"
langchain-community = ">=0.4.1, <0.5"
sentence-transformers = ">=5.4.1, <6"

# ==============================
# Testing
# ==============================
pytest = ">=9.0.3, <10" # Testing framework
pytest-xdist = ">=3.6.1, <4" # Parallel test execution
mutmut = ">=3.5.0, <4"

# ==============================
# Code Quality
# ==============================
ruff = ">=0.11.0, <0.12"         # Linter + Formatter (replaces flake8/black/isort)
pre-commit = ">=4.0.0, <5"       # Git hook manager

# ==============================
# Profiling
# ==============================
psutil = ">=7.2.2, <8"
matplotlib = ">=3.10.9, <4"

# ==============================
# Web & Hugging Face
# ==============================
huggingface-hub = ">=1.10.2, <2"

# ==============================
# Streamlit
# ==============================
streamlit = ">=1.56.0, <2"
streamlit-pdf = ">=2.0.1, <3"
plotly = ">=6.7.0, <7"

# ==============================
# LangGraph
# ==============================
langgraph = ">=1.1.10, <2"
langchain-core = ">=1.3.2, <2"
langgraph-checkpoint-sqlite = ">=3.0.3, <4"
streamlit-searchbox = ">=0.1.24, <0.2"

# ==============================


[target.osx.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu" }
torchvision = { version = "==0.25.0", index = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu" }
torchaudio = { version = "==2.10.0", index = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu" }

[pypi-options]
index-url = "https://pypi.mirrors.ustc.edu.cn/simple"
# extra-index-urls = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"

# NOTE: extra global pixi config is used as below
# [mirrors]
# "https://conda.anaconda.org/conda-forge" = ["https://mirrors.ustc.edu.cn/anaconda/cloud/conda-forge/"]
# "https://conda.anaconda.org/bioconda" = ["https://mirrors.ustc.edu.cn/anaconda/cloud/bioconda/"]


[tasks]

[tasks.ruff-check]
cmd = "ruff check src/ eval/ tests/ main.py"

[tasks.ruff-format]
cmd = "ruff format src/ eval/ tests/ main.py"

[tasks.lint]
cmd = "ruff check --fix src/ eval/ tests/ main.py && ruff format src/ eval/ tests/ main.py"

[tasks.pre-commit-install]
cmd = "pre-commit install && pre-commit install --hook-type post-merge"

[tasks.pre-commit-run]
cmd = "pre-commit run --all-files"

[tasks.test-ui]
cmd = "pytest tests/test_app_smoke.py -m \"unit\" --tb=short -q --durations=5"

[tasks.test-unit]
cmd = "pytest tests/ -m \"unit\" --tb=short -q --durations=5"

[tasks.test]
cmd = "pytest tests/ -m \"not integration and not slow\" --tb=short -q --durations=10"

[tasks.test-all]
cmd = "pytest tests/ --tb=short -q --durations=10"

[tasks.interactive]
cmd = "python main.py --interactive"

[tasks.issue]
cmd = "python -m src.issue.cli"

[tasks.testset]
cmd = "python -m src.testset_cli"

[tasks.web]
cmd = "streamlit run src/app.py --server.port 8501"

[tasks.agent]
cmd = "python -m src.agent.cli"

[tasks._run-exp]
args = ["config"]
cmd = "python eval/run_experiment.py --config {{ config }}"

[tasks.exp]
args = ["name"]
depends-on = [
  { task = "_run-exp", args = [
    "exp_configs/{{ name if '.yaml' in name else name + '.yaml' }}"
  ]}
]

[tasks._run-parser-bench]
args = ["config"]
cmd = "python eval/run_parser_benchmark.py --config {{ config }}"

[tasks.parser-bench]
args = ["name"]
depends-on = [
  { task = "_run-parser-bench", args = [
    "parser_configs/{{ name if '.yaml' in name else name + '.yaml' }}"
  ]}
]

