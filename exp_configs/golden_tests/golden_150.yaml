name: "golden_150"
description: "Golden 150-question test suite with precise answers and ground truth excerpts"

data:
  meal: "5kpage"
  create_if_missing:
    sample_ratio: 0.10
    seed: 42

test_sets:
  - name: "golden_150"
    quality_level: "golden"
    golden_require_reviewed: true

variants:
  - name: "baseline"
    description: "Baseline configuration for golden 150 test"
    config_overrides: {}

evaluation:
  backends: ["builtin", "ragas"]
  llm_preset: "default"
  metrics_preset: "full"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
