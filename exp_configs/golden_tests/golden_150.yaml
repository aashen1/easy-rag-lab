name: "golden_150"
description: "Golden 150-question test suite with precise answers and ground truth excerpts"

data:
  meal: "5kpage"
  create_if_missing:
    sample_ratio: 0.10
    seed: 42

test_sets:
  - name: "golden_150"
    golden: true

variants:
  - name: "baseline"
    description: "Baseline configuration for golden 150 test"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
      - "chunk_hit_rate"
      - "chunk_mrr"
      - "chunk_ndcg"
      - "dedup_hit_rate"
      - "dedup_mrr"
      - "dedup_ndcg"
      - "false_positive_rate"
      - "retrieval_diversity"
      - "context_precision"
      - "context_recall"
      - "recall_3"
      - "recall_5"
      - "recall_10"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
