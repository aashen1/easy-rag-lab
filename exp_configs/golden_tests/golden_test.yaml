name: "golden_test"
description: "Quick regression test suite for RAG system - uses standard quality level"

data:
  meal: "golden_test"
  create_if_missing:
    sample_ratio: 0.03
    seed: 42

test_sets:
  - name: "golden_test_suite"
    on_missing: "auto"
    generation:
      strategy: "hybrid"
      num_questions: 20

variants:
  - name: "baseline"
    description: "Baseline configuration for golden test"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "core"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
