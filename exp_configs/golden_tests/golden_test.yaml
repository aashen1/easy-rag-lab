name: "golden_test"
description: "Golden test suite for RAG system regression testing"

data:
  meal: "golden_test"
  create_if_missing:
    sample_ratio: 0.03
    seed: 42

test_sets:
  - name: "golden_test_suite"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 10

variants:
  - name: "baseline"
    description: "Baseline configuration for golden test"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
      - "chunk_hit_rate"
      - "chunk_mrr"
      - "chunk_ndcg"
      - "dedup_hit_rate"
      - "dedup_mrr"
      - "dedup_ndcg"
      - "false_positive_rate"
      - "recall_3"
      - "recall_5"
      - "recall_10"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
