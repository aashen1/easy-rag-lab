name: "baseline_evaluation"
description: " v0.1.x 基线评测 - 固定长度分块，无优化"

data:
  meal: "test1"
  create_if_missing:
    sample_ratio: 0.05
    seed: 42

test_sets:
  - strategy: "factual"
    num_questions: 20
    seed: 100
  - strategy: "boundary"
    num_questions: 10
    seed: 101
  - strategy: "multi_hop"
    num_questions: 5
    seed: 102


variants:
  - name: "baseline"
    description: "baseline without any overrides. (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
