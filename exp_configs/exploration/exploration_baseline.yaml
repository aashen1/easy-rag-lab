name: "exploration_baseline"
description: "探索实验A - 全量数据基线(12题,当前并发),建立时间基线"

data:
  meal: "all_meal"
  create_if_missing:
    sample_ratio: 1.0
    seed: 42

test_sets:
  - name: "golden_smoke_12q"
    golden: true

variants:
  - name: "baseline"
    description: "基线: chunk_size=512, overlap=0, fixed, vector only"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "core"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
