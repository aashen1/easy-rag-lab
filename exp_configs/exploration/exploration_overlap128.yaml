name: "exploration_overlap128"
description: "探索实验D - overlap=128大重叠测试,验证overlap是否真的无效"

data:
  meal: "all_meal"
  create_if_missing:
    sample_ratio: 1.0
    seed: 42

test_sets:
  - name: "golden_smoke_12q"
    golden: true

variants:
  - name: "overlap_128"
    description: "大重叠: chunk_size=512, overlap=128(25%), fixed"
    config_overrides:
      chunker:
        chunk_overlap: 128

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "core"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
