name: "baseline-1kpage-no-ocr"
description: "DEPRECATED - pymupdf4llm silently ignores use_ocr when OCR not installed, making this config meaningless"

# DEPRECATED: This config is no longer useful because pymupdf4llm silently
# ignores the use_ocr=true parameter when OCR is not installed.
# See baseline_1kpage.yaml instead.

data:
  meal: "1kpage_no_ocr"
  create_if_missing:
    sample_pages: 1000
    seed: 42

test_sets:
  - name: "baseline_test_1kpage_no_ocr"
    on_missing: "auto"
    generation:
      strategy: "hybrid"
      num_questions: 10
      seed: 42

variants:
  - name: "baseline"
    description: "基线配置 (chunk_size: 512, chunk_overlap: 0, OCR关闭)"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  llm_report: false
  metrics_preset: "core"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
