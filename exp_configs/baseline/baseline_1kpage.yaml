name: "baseline-1kpage"
description: "1000页PDF性能基线实验 - 完整流程环节拆解与资源消耗分析"

data:
  meal: "1kpage"
  create_if_missing:
    sample_pages: 1000
    seed: 42

test_sets:
  - name: "baseline_test_1kpage"
    on_missing: "auto"
    generation:
      strategy: "hybrid"
      num_questions: 10
      seed: 42

variants:
  - name: "baseline"
    description: "基线配置 (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

  - name: "with_overlap"
    description: "加入 chunk_overlap: 50 的对照 (chunk_size: 512, chunk_overlap: 50)"
    config_overrides:
      chunker:
        chunk_overlap: 50

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  llm_report: true
  metrics_preset: "extended"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
