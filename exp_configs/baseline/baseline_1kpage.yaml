name: "baseline-1kpage"
description: "1000页PDF性能基线实验 - 完整流程环节拆解与资源消耗分析"

data:
  meal: "1kpage"
  create_if_missing:
    sample_pages: 1000
    seed: 42

test_sets:
  - name: "baseline_test_1kpage"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 10
      seed: 42

variants:
  - name: "baseline"
    description: "基线配置 (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

  - name: "with_overlap"
    description: "加入 chunk_overlap: 50 的对照 (chunk_size: 512, chunk_overlap: 50)"
    config_overrides:
      chunker:
        chunk_overlap: 50

evaluation:
  llm_preset: "default"
  llm_report: true
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
      - "chunk_hit_rate"
      - "chunk_mrr"
      - "chunk_ndcg"
      - "dedup_hit_rate"
      - "dedup_mrr"
      - "dedup_ndcg"
      - "false_positive_rate"
      - "recall_3"
      - "recall_5"
      - "recall_10"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
