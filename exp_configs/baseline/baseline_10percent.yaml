name: "baseline_evaluation"
description: "基线评测 - 固定长度分块，无优化"

data:
  meal: "meal_baseline"
  create_if_missing:
    sample_ratio: 0.1
    seed: 42

test_sets:
  - name: "baseline_test_10pct"
    on_missing: "auto"
    generation:
      strategy: "hybrid"
      num_questions: 35

variants:
  - name: "baseline"
    description: "基线配置 (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "core"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
