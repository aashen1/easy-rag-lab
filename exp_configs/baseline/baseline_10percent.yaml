name: "baseline_evaluation"
description: "基线评测 - 固定长度分块，无优化"

data:
  meal: "meal_baseline"
  create_if_missing:
    sample_ratio: 0.1
    seed: 42

test_sets:
  - name: "baseline_test_10pct"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 35

variants:
  - name: "baseline"
    description: "基线配置 (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
      - "chunk_hit_rate"
      - "chunk_mrr"
      - "chunk_ndcg"
      - "dedup_hit_rate"
      - "dedup_mrr"
      - "dedup_ndcg"
      - "false_positive_rate"
      - "recall_3"
      - "recall_5"
      - "recall_10"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
