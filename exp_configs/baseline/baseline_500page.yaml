name: "baseline-500page"
description: "500页PDF基线 - hybrid策略 + 双后端(builtin+ragas)全指标验证"

data:
  meal: "500page"
  create_if_missing:
    sample_pages: 500
    seed: 42

test_sets:
  - name: "baseline_test_500page"
    on_missing: "auto"
    generation:
      strategy: "hybrid"
      num_questions: 20

variants:
  - name: "baseline"
    description: "基线配置 (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

evaluation:
  backends: ["builtin", "ragas"]
  llm_preset: "default"
  llm_report: true
  metrics_preset: "full"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
