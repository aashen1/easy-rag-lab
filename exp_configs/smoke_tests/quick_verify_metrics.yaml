name: "quick-verify-metrics"
description: "快速验证全指标支持 - 最小规模，仅验证指标可计算性"

data:
  meal: "quick_verify"
  create_if_missing:
    sample_pages: 50
    seed: 42

test_sets:
  - name: "quick_verify_test"
    on_missing: "auto"
    generation:
      strategy: "hybrid"
      num_questions: 6
      type_distribution:
        single_fact: 0.17
        multi_fact: 0.17
        reasoning: 0.17
        comparative: 0.17
        missing: 0.15
        irrelevant: 0.10
        adversarial: 0.07

variants:
  - name: "baseline"
    description: "基线配置 - 全指标验证"
    config_overrides: {}

evaluation:
  backends: ["builtin", "ragas"]
  llm_preset: "default"
  metrics_preset: "full"
  resolution_strategy: "comparison"

llm:
  question_generation: "default"
  answering: "default"
