name: "smoke_quick"
description: "快速冒烟测试 - 最小链路验证，用于调试时快速检查"

data:
  meal: "smoke_quick"
  create_if_missing:
    sample_ratio: 0.03
    seed: 42

test_sets:
  - name: "smoke_quick_test"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 1

variants:
  - name: "baseline"
    description: "基线配置 - 验证基本流程"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "core"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
