name: "smoke_full"
description: "完整冒烟测试 - 覆盖所有功能，用于发布前验证"

data:
  meal: "smoke_full"
  create_if_missing:
    sample_ratio: 0.05
    seed: 42

test_sets:
  - name: "smoke_full_test"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 6
      type_distribution:
        single_fact: 0.20
        multi_fact: 0.20
        reasoning: 0.15
        comparative: 0.15
        missing: 0.15
        irrelevant: 0.15

variants:
  - name: "baseline"
    description: "基线配置"
    config_overrides: {}

  - name: "bm25"
    description: "BM25稀疏检索"
    config_overrides:
      retrieval:
        method: "bm25"
        top_k: 5

  - name: "hybrid_rrf"
    description: "混合检索 - RRF融合"
    config_overrides:
      retrieval:
        method: "hybrid"
        top_k: 5
        hybrid:
          fusion: "rrf"
          rrf_k: 60

  - name: "reranker"
    description: "向量检索 + Cross-Encoder重排"
    config_overrides:
      retrieval:
        method: "vector"
        top_k: 5
        reranker:
          enabled: true
          model_name: "BAAI/bge-reranker-large"
          top_n: 3

  - name: "hyde"
    description: "HyDE查询改写"
    config_overrides:
      retrieval:
        method: "vector"
        top_k: 5
        query_rewrite:
          enabled: true
          strategy: "hyde"

  - name: "multi_query"
    description: "Multi-Query查询改写"
    config_overrides:
      retrieval:
        method: "vector"
        top_k: 5
        query_rewrite:
          enabled: true
          strategy: "multi_query"
          num_queries: 3

  - name: "semantic_chunk"
    description: "语义分块策略"
    config_overrides:
      chunker:
        strategy: "semantic"
        chunk_size: 512
        semantic:
          similarity_threshold: 0.5
          min_chunk_size: 100

evaluation:
  llm_preset: "default"
  llm_report: true
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
