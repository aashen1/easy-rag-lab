name: "golden_test"
description: "Golden test suite for RAG system regression testing"

data:
  meal: "golden_test"
  create_if_missing:
    sample_ratio: 0.03
    seed: 42

test_sets:
  - strategy: "document"
    num_questions: 10

variants:
  - name: "baseline"
    description: "Baseline configuration for golden test"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"
