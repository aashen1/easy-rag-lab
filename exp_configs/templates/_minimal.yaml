name: "my_experiment"
description: "实验描述"

data:
  meal: "my_meal"
  create_if_missing:
    sample_ratio: 0.1
    seed: 42

test_sets:
  - name: "my_test_set"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 10

variants:
  - name: "baseline"
    description: "基线配置"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "extended"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
