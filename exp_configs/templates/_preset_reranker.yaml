name: "reranker_experiment"
description: "重排序对比实验模板"

data:
  meal: "meal_reranker"
  create_if_missing:
    sample_ratio: 0.1
    seed: 42

test_sets:
  - name: "reranker_preset_eval"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 30

variants:
  - name: "no_rerank"
    description: "无重排序（基线）"
    config_overrides:
      retrieval:
        method: "vector"
        top_k: 5
        reranker:
          enabled: false

  - name: "rerank_top3"
    description: "Cross-Encoder重排，保留top-3"
    config_overrides:
      retrieval:
        method: "vector"
        top_k: 5
        reranker:
          enabled: true
          model_name: "BAAI/bge-reranker-large"
          top_n: 3

  - name: "rerank_top5"
    description: "Cross-Encoder重排，保留top-5"
    config_overrides:
      retrieval:
        method: "vector"
        top_k: 10
        reranker:
          enabled: true
          model_name: "BAAI/bge-reranker-large"
          top_n: 5

  - name: "hybrid_rerank"
    description: "混合检索 + Cross-Encoder重排"
    config_overrides:
      retrieval:
        method: "hybrid"
        top_k: 10
        hybrid:
          fusion: "rrf"
          rrf_k: 60
        reranker:
          enabled: true
          model_name: "BAAI/bge-reranker-large"
          top_n: 5

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "extended"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
