# ============================================================
# 完整实验配置模板 - 展示所有可用选项
# ============================================================
#
# config_overrides 工作原理：
#   实验运行时，config_overrides 会与 config.yaml（最小基线）做深度合并。
#   基线默认：纯向量检索、无重排序、无查询改写。
#   只需在 config_overrides 中指定要修改的字段即可开启高级功能。
#
#   合并规则：
#     - 字典类型：递归合并（基线 + 覆盖）
#     - 非字典类型：覆盖基线值
#     - 基线中不存在的字段：直接添加
# ============================================================

name: "complete_template"
description: "完整配置模板 - 包含所有可用选项的示例"

# ------------------------------------------------------------
# 数据源配置
# ------------------------------------------------------------
data:
  meal: "my_meal"
  create_if_missing:
    sample_ratio: 0.1
    sample_count: null
    seed: 42

# ------------------------------------------------------------
# 问题集配置
# ------------------------------------------------------------
# 命名方式（二选一）：
#
#   方式 A：显式指定 name（推荐用于需要追踪/复用的测试集）
#     测试集会持久化到磁盘，下次运行时按名称命中缓存。
#
#   方式 B：省略 name（快速实验，不关心测试集叫什么）
#     系统会根据 generation 配置自动推导名称，格式为 "{strategy}_n{num_questions}"。
#     相同 generation 配置会命中同一个缓存测试集，行为与旧版本一致。
#     示例：
#       test_sets:
#         - on_missing: "auto"
#           generation:
#             strategy: "document"
#             num_questions: 20
#       # 自动命名为 "document_n20"，下次运行同配置可复用
# ------------------------------------------------------------
test_sets:
  - name: "golden_test"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 20
      seed: 100
      type_distribution:
        single_fact: 0.30
        multi_fact: 0.25
        reasoning: 0.15
        comparative: 0.15
        missing: 0.10
        irrelevant: 0.05
        adversarial: 0.00

# ------------------------------------------------------------
# 变体配置 - 核心实验参数
# ------------------------------------------------------------
variants:
  - name: "baseline"
    description: "基线配置 - 使用 config.yaml 的默认值（纯向量检索，无高级功能）"
    config_overrides: {}

  - name: "custom_chunk"
    description: "自定义分块配置"
    config_overrides:
      chunker:
        strategy: "fixed"
        chunk_size: 512
        chunk_overlap: 50
        semantic:
          similarity_threshold: 0.5
          min_chunk_size: 100
          breakpoint_percentile: 25

  - name: "custom_embedding"
    description: "自定义Embedding配置"
    config_overrides:
      embedding:
        model_name: "BAAI/bge-large-zh-v1.5"
        device: "cuda"
        batch_size: 32

  - name: "custom_vector_store"
    description: "自定义向量存储配置"
    config_overrides:
      vector_store:
        type: "qdrant"
        collection_name: "my_collection"
        persist_dir: "data/vector_store"
        distance: "Cosine"

  - name: "hybrid_retrieval"
    description: "混合检索配置"
    config_overrides:
      retrieval:
        method: "hybrid"
        top_k: 5
        bm25:
          k1: 1.5
          b: 0.75
        hybrid:
          fusion: "rrf"
          rrf_k: 60
          vector_weight: 0.7
          bm25_weight: 0.3
        reranker:
          enabled: true
          model_name: "BAAI/bge-reranker-large"
          top_n: 3
        query_rewrite:
          enabled: true
          strategy: "hyde"
          num_queries: 3

# ------------------------------------------------------------
# 评测配置
# ------------------------------------------------------------
# metrics_preset 可选值：
#   core     — 日常实验：hit_rate/mrr/ndcg/recall + faithfulness/answer_relevancy
#   extended — 深度诊断：core + chunk_*/dedup_*/context_precision/context_recall
#   full     — 版本发布：extended + answer_correctness/semantic_similarity/false_positive_rate/retrieval_diversity
#   custom   — 自定义指标列表（需配合 custom_metrics 使用）
#
# resolution_strategy 可选值：
#   priority_fallback — 每个指标只由最高优先级后端计算，避免重复（默认，节省 token）
#   comparison        — 所有后端都计算各自支持的指标，结果加前缀区分（用于对标验证）
evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  llm_report: false
  metrics_preset: "extended"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]
  # custom_metrics:                    # 仅 metrics_preset: "custom" 时生效
  #   retrieval: [hit_rate, mrr, ndcg]
  #   generation: [faithfulness, answer_correctness]

# ------------------------------------------------------------
# LLM配置
# ------------------------------------------------------------
llm:
  question_generation: "default"
  answering: "default"
