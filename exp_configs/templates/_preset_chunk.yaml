name: "chunk_experiment"
description: "分块参数对比实验模板"

data:
  meal: "meal_chunk"
  create_if_missing:
    sample_ratio: 0.1
    seed: 42

test_sets:
  - name: "chunk_preset_eval"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 30
      type_distribution:
        single_fact: 0.30
        multi_fact: 0.25
        reasoning: 0.15
        comparative: 0.15
        missing: 0.10
        irrelevant: 0.05

x-base-config: &base-config
  retrieval:
    method: "vector"
    top_k: 5

variants:
  - name: "chunk_256_overlap_0"
    description: "small chunk, no overlap"
    config_overrides:
      <<: *base-config
      chunker:
        chunk_size: 256
        chunk_overlap: 0

  - name: "chunk_512_overlap_0"
    description: "medium chunk, no overlap"
    config_overrides:
      <<: *base-config
      chunker:
        chunk_size: 512
        chunk_overlap: 0

  - name: "chunk_512_overlap_50"
    description: "medium chunk, small overlap"
    config_overrides:
      <<: *base-config
      chunker:
        chunk_size: 512
        chunk_overlap: 50

  - name: "chunk_1024_overlap_0"
    description: "large chunk, no overlap"
    config_overrides:
      <<: *base-config
      chunker:
        chunk_size: 1024
        chunk_overlap: 0

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
      - "chunk_hit_rate"
      - "chunk_mrr"
      - "chunk_ndcg"
      - "dedup_hit_rate"
      - "dedup_mrr"
      - "dedup_ndcg"
      - "false_positive_rate"
      - "recall_3"
      - "recall_5"
      - "recall_10"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
