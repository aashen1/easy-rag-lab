name: "test_llm_report_321"
description: " v0.1.x 快速测试，稍微给一点问题，测试LLM报告总结的功能"

data:
  meal: "test1"
  create_if_missing:
    sample_ratio: 0.05
    seed: 42

test_sets:
  - strategy: "document"
    num_questions: 6


variants:
  - name: "baseline"
    description: "baseline without any overrides. (chunk_size: 512, chunk_overlap: 0)"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  llm_report: true
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
