name: "ragas_only_evaluation"
description: "RAGAS评测 - 使用RAGAS框架进行检索与生成质量评测"

data:
  meal: "meal_ragas"
  create_if_missing:
    sample_ratio: 0.1
    seed: 42

test_sets:
  - name: "ragas_only_test"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 20

variants:
  - name: "baseline_ragas"
    description: "基线配置 - RAGAS检索+生成指标评测"
    config_overrides: {}

evaluation:
  backends: ["ragas"]
  llm_preset: "default"
  metrics_preset: "full"

llm:
  question_generation: "default"
  answering: "default"
