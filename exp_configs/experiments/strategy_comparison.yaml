name: "strategy_comparison"
description: "问题生成策略对比实验 - 比较不同类型分布在问答质量上的差异"

data:
  meal: "meal_strategy_comparison"
  create_if_missing:
    sample_ratio: 0.15
    seed: 42

test_sets:
  - name: "single_fact_focused"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 5
      seed: 700
      type_distribution:
        single_fact: 0.80
        multi_fact: 0.10
        reasoning: 0.05
        comparative: 0.05
        missing: 0.0
        irrelevant: 0.0
        adversarial: 0.0
  - name: "multi_fact_focused"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 5
      seed: 701
      type_distribution:
        single_fact: 0.10
        multi_fact: 0.80
        reasoning: 0.05
        comparative: 0.05
        missing: 0.0
        irrelevant: 0.0
        adversarial: 0.0
  - name: "reasoning_focused"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 5
      seed: 702
      type_distribution:
        single_fact: 0.10
        multi_fact: 0.10
        reasoning: 0.70
        comparative: 0.10
        missing: 0.0
        irrelevant: 0.0
        adversarial: 0.0
  - name: "balanced_document"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 15
      type_distribution:
        single_fact: 0.30
        multi_fact: 0.20
        reasoning: 0.17
        comparative: 0.13
        missing: 0.10
        irrelevant: 0.04
        adversarial: 0.06

variants:
  - name: "baseline"
    description: "Baseline configuration - runs on both old and new strategy test sets"
    config_overrides: {}

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "extended"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
