name: "strategy_comparison"
description: "问题生成策略对比实验 - 比较不同类型分布在问答质量上的差异"

data:
  meal: "meal_strategy_comparison"
  create_if_missing:
    sample_ratio: 0.15
    seed: 42

test_sets:
  - name: "single_fact_focused"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 5
      seed: 700
      type_distribution:
        single_fact: 0.80
        multi_fact: 0.10
        reasoning: 0.05
        comparative: 0.05
        missing: 0.0
        irrelevant: 0.0
  - name: "multi_fact_focused"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 5
      seed: 701
      type_distribution:
        single_fact: 0.10
        multi_fact: 0.80
        reasoning: 0.05
        comparative: 0.05
        missing: 0.0
        irrelevant: 0.0
  - name: "reasoning_focused"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 5
      seed: 702
      type_distribution:
        single_fact: 0.10
        multi_fact: 0.10
        reasoning: 0.70
        comparative: 0.10
        missing: 0.0
        irrelevant: 0.0
  - name: "balanced_document"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 15
      type_distribution:
        single_fact: 0.33
        multi_fact: 0.27
        reasoning: 0.20
        comparative: 0.13
        missing: 0.07

variants:
  - name: "baseline"
    description: "Baseline configuration - runs on both old and new strategy test sets"
    config_overrides: {}

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
