name: "chunk_comparison"
description: "分块参数对比实验 - 探究不同 chunk_size 和 overlap 对检索质量的影响"

data:
  meal: "meal_chunk_comparison"
  create_if_missing:
    sample_ratio: 0.2
    seed: 42

test_sets:
  - strategy: "document"
    num_questions: 50
    type_distribution:
      single_fact: 0.30
      multi_fact: 0.25
      reasoning: 0.15
      comparative: 0.15
      missing: 0.10
      irrelevant: 0.05

variants:
  - name: "chunk_256_overlap_0"
    description: "chunk_size=256, overlap=0 (小块无重叠)"
    config_overrides:
      chunker:
        chunk_size: 256
        chunk_overlap: 0

  - name: "chunk_512_overlap_0"
    description: "chunk_size=512, overlap=0 (中块无重叠)"
    config_overrides:
      chunker:
        chunk_size: 512
        chunk_overlap: 0

  - name: "chunk_512_overlap_50"
    description: "chunk_size=512, overlap=50 (中块小重叠)"
    config_overrides:
      chunker:
        chunk_size: 512
        chunk_overlap: 50

  - name: "chunk_512_overlap_128"
    description: "chunk_size=512, overlap=128 (中块大重叠)"
    config_overrides:
      chunker:
        chunk_size: 512
        chunk_overlap: 128

  - name: "chunk_1024_overlap_0"
    description: "chunk_size=1024, overlap=0 (大块无重叠)"
    config_overrides:
      chunker:
        chunk_size: 1024
        chunk_overlap: 0

  - name: "chunk_1024_overlap_256"
    description: "chunk_size=1024, overlap=256 (大块有重叠)"
    config_overrides:
      chunker:
        chunk_size: 1024
        chunk_overlap: 256

evaluation:
  llm_preset: "default"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"

llm:
  question_generation: "default"
  answering: "default"
