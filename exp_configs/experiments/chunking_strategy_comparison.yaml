name: "chunking_strategy_comparison"
description: "分块策略对比实验 - 对比固定分块与语义分块对问答质量的影响"

data:
  meal: "meal_chunking_strategy_comparison"
  create_if_missing:
    sample_ratio: 0.2
    seed: 42

test_sets:
  - name: "chunking_strategy_eval"
    on_missing: "auto"
    generation:
      strategy: "document"
      num_questions: 65

variants:
  - name: "fixed_512_overlap_0"
    description: "固定分块 - chunk_size=512, overlap=0（基线）"
    config_overrides:
      chunker:
        strategy: "fixed"
        chunk_size: 512
        chunk_overlap: 0

  - name: "semantic_threshold_50"
    description: "语义分块 - 相似度阈值0.5"
    config_overrides:
      chunker:
        strategy: "semantic"
        chunk_size: 512
        semantic:
          similarity_threshold: 0.5
          min_chunk_size: 100

  - name: "semantic_threshold_30"
    description: "语义分块 - 相似度阈值0.3（更少断点）"
    config_overrides:
      chunker:
        strategy: "semantic"
        chunk_size: 512
        semantic:
          similarity_threshold: 0.3
          min_chunk_size: 100

  - name: "semantic_percentile_25"
    description: "语义分块 - 25百分位断点"
    config_overrides:
      chunker:
        strategy: "semantic"
        chunk_size: 512
        semantic:
          similarity_threshold: 0.5
          breakpoint_percentile: 25
          min_chunk_size: 100

evaluation:
  backends: ["builtin"]
  llm_preset: "default"
  metrics_preset: "extended"
  resolution_strategy: "priority_fallback"
  backend_priority: ["builtin", "ragas"]

llm:
  question_generation: "default"
  answering: "default"
