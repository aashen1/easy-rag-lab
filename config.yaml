# ============================================================
# 系统配置
# ============================================================

# 当前激活的 LLM 预设名称
active_mode: "default"

# LLM 预设配置：定义不同的模型配置方案
llm_presets:
  default:
    model_name: "LLM_MODEL_ID"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_API_KEY"
    base_url: "LLM_BASE_URL"

  opus:
    model_name: "claude-3-opus-20240229"
    temperature: 0.7
    max_tokens: 4096
    api_key: "LLM_KEY_OPUS"
    base_url: "LLM_URL_OPUS"

  sonnet:
    model_name: "claude-3-5-sonnet-20241022"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_SONNET"
    base_url: "LLM_URL_SONNET"

  haiku:
    model_name: "claude-3-haiku-20240307"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_HAIKU"
    base_url: "LLM_URL_HAIKU"

# ============================================================
# 数据处理配置
# ============================================================

# PDF 解析配置
parser:
  input_dir: "data/raw"
  output_dir: "data/parsed"

# 分块配置
chunker:
  input_dir: "data/parsed"
  output_dir: "data/chunks"
  strategy: "fixed"          # Chunking strategy: "fixed" or "semantic"
  chunk_size: 512            # Max tokens per chunk
  chunk_overlap: 0           # Overlap tokens between chunks (fixed strategy)
  semantic:
    similarity_threshold: 0.5    # Cosine similarity threshold for breakpoints
    breakpoint_percentile: null  # Use percentile-based threshold (null = disabled)
    min_chunk_size: 100          # Minimum tokens per chunk

# 向量化配置
embedding:
  model_name: "BAAI/bge-large-zh-v1.5"
  device: "cuda"
  batch_size: 32

# 向量存储配置
vector_store:
  type: "qdrant"
  collection_name: "financial_reports"
  persist_dir: "data/vector_store"
  distance: "Cosine"

# 检索配置
retrieval:
  method: "vector"          # Retrieval method: "vector", "bm25", or "hybrid"
  top_k: 5
  bm25:
    k1: 1.5                 # BM25 term frequency saturation parameter
    b: 0.75                 # BM25 length normalization parameter
  hybrid:
    fusion: "rrf"           # Fusion strategy: "rrf" or "weighted"
    rrf_k: 60               # RRF constant (higher = dampen rank impact)
    vector_weight: 0.7      # Weight for vector scores in weighted fusion
    bm25_weight: 0.3        # Weight for BM25 scores in weighted fusion
  reranker:
    enabled: false          # Enable cross-encoder reranking
    model_name: "BAAI/bge-reranker-large"  # Cross-encoder model
    device: "cuda"          # Reranker device
    top_n: 3                # Number of results to keep after reranking
  query_rewrite:
    enabled: false          # Enable query rewriting
    strategy: "hyde"        # Strategy: "hyde" or "multi_query"
    num_queries: 3          # Number of sub-queries for multi_query strategy

# ============================================================
# 实验管理配置
# ============================================================

# 实验相关配置：管理实验报告和配置文件
experiments:
  dir: "data/exp_reports"  # 实验报告存放目录
  configs_dir: "exp_configs"  # 实验配置文件目录

# ============================================================
# 数据管理配置
# ============================================================

# Meal 数据管理配置
meals:
  dir: "data/meals"
  collection_prefix: "m_"

# Artifacts 存储配置
artifacts:
  dir: "data/artifacts"

# ============================================================
# 评测系统配置
# ============================================================

# 评测系统配置
evaluation:
  # 评测后端选择：["builtin"], ["ragas"], 或 ["builtin", "ragas"]
  backends: ["builtin"]
  
  # RAGAS 专用配置
  ragas:
    enabled: false
    llm_backend: "anthropic"        # 使用 LangChain Anthropic 接口（推荐）
    embeddings_backend: "local"     # 使用本地 BGE 或 "openai"
    run_config:
      max_workers: 5
      timeout: 60
      max_retries: 3

# ============================================================
# 测试与日志配置
# ============================================================

# 测试集生成配置
test_generation:
  default_strategy: "factual"
  default_num_questions: 20
  max_retries: 3
  document_level:
    enabled: true
    default_num_questions: 20
    type_distribution:
      single_fact: 0.30
      multi_fact: 0.25
      reasoning: 0.15
      comparative: 0.15
      missing: 0.10
      irrelevant: 0.05
    quality_control:
      enable_authenticity_check: true
      enable_llm_evaluation: false
      min_authenticity_score: 12
    max_retries: 3

# Token 成本配置：各模型的定价和折算系数
token_cost:
  models:
    LongCat-Flash-Lite:
      input_price_per_1k: 0.001
      output_price_per_1k: 0.002
      conversion_factor: 1.0
    claude-3-opus-20240229:
      input_price_per_1k: 0.015
      output_price_per_1k: 0.075
      conversion_factor: 15.0
    claude-3-5-sonnet-20241022:
      input_price_per_1k: 0.003
      output_price_per_1k: 0.015
      conversion_factor: 3.0
    claude-3-haiku-20240307:
      input_price_per_1k: 0.00025
      output_price_per_1k: 0.00125
      conversion_factor: 0.25

# 日志配置
logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  log_dir: "logs"
  rotation: "10 MB"
  retention: "7 days"
