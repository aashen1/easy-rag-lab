# ============================================================
# 系统配置（最小基线）
# ============================================================
#
# 本配置定义 RAG 管线的最小基线（baseline）：
#   PDF → MD → 固定长度无重叠切块 → 向量化 → 纯向量检索 → 生成回答
#
# 高级功能（混合检索、重排序、查询改写等）默认关闭，
# 需要通过实验配置（exp_configs/）的 config_overrides 显式开启。
# 这样做是为了确保对比实验的基线是"无优化"状态，
# 各优化技术的提升效果才能被清晰度量。
#
# 示例：在实验配置中开启重排序
#   variants:
#     - name: "with_reranker"
#       config_overrides:
#         retrieval:
#           reranker:
#             enabled: true
# ============================================================

# 当前激活的 LLM 预设名称
active_mode: "default"

# 数据根目录：所有以 "data/" 开头的路径都会基于此目录解析。
# 默认值 "data" 表示使用项目根目录下的 data/ 文件夹。
# 如果你的数据存放在其他位置（如独立硬盘），可以修改此值，
# 例如：data_dir: "D:/rag-data"
# 这样就无需使用 mklink 创建符号链接了。
data_dir: "data"

# LLM 预设配置：定义不同的模型配置方案
llm_presets:
  default:
    model_name: "LLM_MODEL_ID"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_API_KEY"
    base_url: "LLM_BASE_URL"

  opus:
    model_name: "claude-3-opus-20240229"
    temperature: 0.7
    max_tokens: 4096
    api_key: "LLM_KEY_OPUS"
    base_url: "LLM_URL_OPUS"

  sonnet:
    model_name: "claude-3-5-sonnet-20241022"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_SONNET"
    base_url: "LLM_URL_SONNET"

  haiku:
    model_name: "claude-3-haiku-20240307"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_HAIKU"
    base_url: "LLM_URL_HAIKU"

# ============================================================
# 数据处理配置
# ============================================================

# PDF 解析配置
# NOTE: Parsed output is managed by the artifact system (data/artifacts/{data_id}/parsed_{hash}/).
# The parser.output_dir and chunker.input_dir/output_dir fields are no longer used for I/O.
parser:
  input_dir: "data/raw"
  algorithm: "pymupdf4llm"
  pymupdf4llm:
    header: false
    footer: false
    page_separators: false     # Redundant when page_chunks=True; Layout mode auto-handles page breaks
    write_images: false        # Layout mode auto-classifies images; this controls not writing image files
    page_chunks: true          # Enable page-level output for page-aware chunking
    force_text: true           # Preserve text overlaid on charts (financial reports)
    ignore_code: true          # Avoid financial data tables being marked as code blocks
    use_ocr: true              # Keep OCR fallback for scanned pages
    ocr_language: "chi_sim+eng"  # Chinese + English OCR support
    show_progress: true        # Show parsing progress
    clean_degenerate_tables: true  # Remove empty markdown table rows (|||||) from parser output
  fitz_pdfplumber:
    header_filter: true
    footer_filter: true
    header_zone_ratio: 0.10
    footer_zone_ratio: 0.10
    table_strategy: "lines"
    table_settings:
      snap_tolerance: 5
      join_tolerance: 5
      edge_min_length: 10
      intersection_x_tolerance: 5
      intersection_y_tolerance: 5
    column_detection: true
    noise_patterns:
      - "请务必阅读.{0,20}声明"
      - "^\\s*\\d+\\s*$"
      - "^\\s*\\d+\\s*/\\s*\\d+\\s*$"
      - "(?:内部资料|机密|仅供参考).{0,30}$"
      - "^(?:www\\.|http).+$"

# 分块配置
# NOTE: Chunk I/O paths are managed by the artifact system (data/artifacts/{data_id}/chunks_{hash}/).
chunker:
  strategy: "fixed"          # Chunking strategy: "fixed" or "semantic"
  encoding: "bge"            # Tokenizer encoding: "bge" (align with embedder) or "cl100k_base" (tiktoken)
  chunk_size: 512            # Max tokens per chunk
  # chunk_overlap: 64           # Overlap tokens between chunks (fixed strategy)
  chunk_overlap: 0           # Overlap tokens between chunks (fixed strategy)
  cross_page_overlap: 0       # Tokens from previous page prepended to current page (page_aware_fixed only)
  semantic:
    similarity_threshold: 0.5    # Cosine similarity threshold for breakpoints
    breakpoint_percentile: null  # Use percentile-based threshold (null = disabled)
    min_chunk_size: 100          # Minimum tokens per chunk

# 向量化配置
embedding:
  model_name: "BAAI/bge-large-zh-v1.5"
  device: "cuda"
  batch_size: 32
  query_instruction: null    # Instruction prefix for queries; null = auto-detect (BGE models use "为这个句子生成表示以用于检索相关文章：")

# 向量存储配置
vector_store:
  type: "qdrant"
  collection_name: "financial_reports"
  persist_dir: "data/vector_store"
  distance: "Cosine"

# 检索配置（基线：纯向量检索，高级功能通过实验配置开启）
retrieval:
  method: "vector"          # Retrieval method: "vector", "bm25", or "hybrid"
  top_k: 5
  score_threshold: 0.3      # Minimum similarity score to include (typical: 0.3-0.5)
  bm25:                     # BM25 参数（method=bm25 或 hybrid 时生效）
    k1: 1.5                 # BM25 term frequency saturation parameter
    b: 0.75                 # BM25 length normalization parameter
  hybrid:                   # 混合检索参数（method=hybrid 时生效）
    fusion: "rrf"           # Fusion strategy: "rrf" or "weighted"
    rrf_k: 60               # RRF constant (higher = dampen rank impact)
    vector_weight: 0.7      # Weight for vector scores in weighted fusion
    bm25_weight: 0.3        # Weight for BM25 scores in weighted fusion
  reranker:                 # 重排序（默认关闭，通过实验配置开启）
    enabled: false          # Enable cross-encoder reranking
    model_name: "BAAI/bge-reranker-large"  # Cross-encoder model
    device: "cuda"          # Reranker device
    top_n: 3                # Number of results to keep after reranking
  query_rewrite:            # 查询改写（默认关闭，通过实验配置开启）
    enabled: false          # Enable query rewriting
    strategy: "hyde"        # Strategy: "hyde" or "multi_query"
    num_queries: 3          # Number of sub-queries for multi_query strategy

# 生成配置（基线：使用硬编码默认 system prompt，通过实验配置覆盖）
generation:
  system_prompt: null       # Custom system prompt for the generator (null = use hardcoded default)
  max_context_tokens: 8000  # Maximum total input tokens (system_prompt + contexts + query). 8000 = protect against context overflow

# ============================================================
# 实验管理配置
# ============================================================

# 实验相关配置：管理实验报告和配置文件
experiments:
  dir: "data/exp_reports"  # 实验报告存放目录
  configs_dir: "exp_configs"  # 实验配置文件目录
  profiling:
    enabled: true  # 是否启用性能分析（设为 false 可完全禁用，零性能开销）
    monitor_interval: 0.5  # 资源监控采样间隔（秒）
    generate_charts: true  # 是否生成可视化图表
  reuse:
    mode: "none"  # 实验报告复用模式：none / in_place / copy_migrate
    # target_dir: null  # in_place 模式的目标实验目录
    # source_dir: null  # copy_migrate 模式的来源实验目录
    backup_before_append: true  # in_place 专用：增补前创建完整快照备份

# ============================================================
# 数据管理配置
# ============================================================

# Meal 数据管理配置
meals:
  dir: "data/meals"
  collection_prefix: "m_"

# Artifacts 存储配置
artifacts:
  dir: "data/artifacts"

# LLM 评测器配置（用于 metrics 计算）
llm_evaluator:
  model_name: "LLM_MODEL_ID"
  base_url: "LLM_BASE_URL"
  extract_statements:
    temperature: 0.0
    max_tokens: 1024
  verify_statements:
    temperature: 0.0
    max_tokens: 1024
  faithfulness:
    temperature: 0.0
    max_tokens: 512
  answer_relevancy:
    temperature: 0.0
    max_tokens: 512
  context_precision:
    temperature: 0.0
    max_tokens: 256
  context_recall:
    temperature: 0.0
    max_tokens: 256
  context_relevance:
    temperature: 0.0
    max_tokens: 256
  infer_check:
    temperature: 0.0
    max_tokens: 64
  report_generation:
    model_name: "LLM_MODEL_ID"
    temperature: 0.3
    max_tokens: 4096

# ============================================================
# 评测系统配置
# ============================================================

# 评测系统配置
evaluation:
  # 评测后端选择：["builtin"], ["ragas"], 或 ["builtin", "ragas"]
  backends: ["builtin"]
  normalize_source_include_parent: true

  # 指标解析策略：priority_fallback 或 comparison
  # priority_fallback: 每个指标只由最高优先级后端计算，避免重复（默认，节省 token）
  # comparison: 所有后端都计算各自支持的指标，结果加前缀区分（用于对标验证）
  resolution_strategy: "priority_fallback"

  # 后端优先级（从高到低），仅 priority_fallback 模式生效
  backend_priority: ["builtin", "ragas"]

  # 指标预设：core / extended / full / custom
  # core: 日常实验（hit_rate/mrr/ndcg/recall + faithfulness/answer_relevancy）
  # extended: 深度诊断（core + chunk/dedup/context_precision/context_recall）
  # full: 版本发布（extended + answer_correctness/semantic_similarity）
  # custom: 自定义指标列表（需配合 custom_metrics 使用）
  metrics_preset: "core"

  # 自定义指标配置（仅 metrics_preset: "custom" 时生效）
  # custom_metrics:
  #   retrieval: [hit_rate, mrr, ndcg]
  #   generation: [faithfulness, answer_correctness]

  # RAGAS 专用配置
  ragas:
    enabled: false
    llm_backend: "anthropic"        # 使用 LangChain Anthropic 接口（推荐）
    embeddings_backend: "local"     # 使用本地 BGE 或 "openai"
    max_tokens: 8192               # RAGAS 评测需要更大的 max_tokens（默认 LLM 的 1024 不够）
    run_config:
      max_workers: 10
      timeout: 180                # RAGAS 评测可能需要更长时间
      max_retries: 3

  # 并发配置（基于 stress_test_concurrency_v2.py 实测：API safe_max=21）
  concurrent_queries: 10            # 问题查询并发度（1=串行，实测 safe_max=21，取保守值）
  builtin_concurrent_workers: 10   # builtin 生成指标并发计算线程数（实测 safe_max=21，取保守值）

# LLM API 重试配置
llm_retry:
  max_retries: 5                   # 429/overload 最大重试次数
  base_delay: 1.0                  # 首次重试等待秒数
  max_delay: 60.0                  # 最大等待秒数

# ============================================================
# 测试与日志配置
# ============================================================

# 测试集生成配置
test_generation:
  default_strategy: "hybrid"
  default_num_questions: 20
  max_retries: 3
  model_name: "LLM_MODEL_ID"
  temperature: 0.7
  max_tokens: 1024
  supplement_max_tokens: 1024
  initial_max_tokens: 512

  validation:
    check_proper_nouns: false

  hybrid:
    enabled: true
    segment_size: 8000
    compact_segment_max_chars: 6000
    segment_sampling_strategy: "random"
    quote_fuzzy_match_threshold: 0.85
    multi_hop_candidate_count: 3

  document_level:
    enabled: true
    default_num_questions: 20
    type_distribution:
      single_fact: 0.30
      multi_fact: 0.25
      reasoning: 0.15
      comparative: 0.15
      missing: 0.10
      irrelevant: 0.05
    quality_control:
      enable_authenticity_check: true
      enable_llm_evaluation: false
      min_authenticity_score: 12
    max_retries: 3

# Token 成本配置：各模型的定价和折算系数（非真实数据，由 AI 生成）
token_cost:
  models:
    LongCat-Flash-Lite:
      input_price_per_1k: 0.001
      output_price_per_1k: 0.002
      conversion_factor: 1.0
    claude-3-opus-20240229:
      input_price_per_1k: 0.015
      output_price_per_1k: 0.075
      conversion_factor: 15.0
    claude-3-5-sonnet-20241022:
      input_price_per_1k: 0.003
      output_price_per_1k: 0.015
      conversion_factor: 3.0
    claude-3-haiku-20240307:
      input_price_per_1k: 0.00025
      output_price_per_1k: 0.00125
      conversion_factor: 0.25

# 日志配置
logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  log_dir: "logs"
  rotation: "10 MB"
  retention: "7 days"
