active_mode: "default"

llm_presets:
  default:
    model_name: "LLM_MODEL_ID"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_API_KEY"
    base_url: "LLM_BASE_URL"

  opus:
    model_name: "claude-3-opus-20240229"
    temperature: 0.7
    max_tokens: 4096
    api_key: "LLM_KEY_OPUS"
    base_url: "LLM_URL_OPUS"

  sonnet:
    model_name: "claude-3-5-sonnet-20241022"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_SONNET"
    base_url: "LLM_URL_SONNET"

  haiku:
    model_name: "claude-3-haiku-20240307"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_HAIKU"
    base_url: "LLM_URL_HAIKU"

parser:
  input_dir: "data/raw"
  output_dir: "data/parsed"

chunker:
  input_dir: "data/parsed"
  output_dir: "data/chunks"
  chunk_size: 512
  chunk_overlap: 0

embedding:
  model_name: "BAAI/bge-large-zh-v1.5"
  device: "cuda"
  batch_size: 32

vector_store:
  type: "qdrant"
  collection_name: "financial_reports"
  persist_dir: "data/vector_store"
  distance: "Cosine"

retrieval:
  top_k: 5

evaluation:
  test_data_path: "eval/test_data.json"
  results_dir: "eval/results"
  metrics:
    retrieval:
      - "hit_rate"
      - "mrr"
      - "ndcg"
    generation:
      - "faithfulness"
      - "answer_relevancy"

logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  log_dir: "logs"
  rotation: "10 MB"
  retention: "7 days"
