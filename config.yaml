# ============================================================
# 系统配置（最小基线）
# ============================================================
#
# 本配置定义 RAG 管线的最小基线（baseline）：
#   PDF → MD → 固定长度无重叠切块 → 向量化 → 纯向量检索 → 生成回答
#
# 高级功能（混合检索、重排序、查询改写等）默认关闭，
# 需要通过实验配置（exp_configs/）的 config_overrides 显式开启。
# 这样做是为了确保对比实验的基线是"无优化"状态，
# 各优化技术的提升效果才能被清晰度量。
#
# 示例：在实验配置中开启重排序
#   variants:
#     - name: "with_reranker"
#       config_overrides:
#         retrieval:
#           reranker:
#             enabled: true
# ============================================================

# 当前激活的 LLM 预设名称
active_mode: "default"

# 数据根目录：所有以 "data/" 开头的路径都会基于此目录解析。
# 默认值 "data" 表示使用项目根目录下的 data/ 文件夹。
# 如果你的数据存放在其他位置（如独立硬盘），可以修改此值，
# 例如：data_dir: "D:/rag-data"
# 这样就无需使用 mklink 创建符号链接了。
data_dir: "data"

# LLM 预设配置：定义不同的模型配置方案
llm_presets:
  default:
    model_name: "LLM_MODEL_ID"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_API_KEY"
    base_url: "LLM_BASE_URL"

  opus:
    model_name: "claude-3-opus-20240229"
    temperature: 0.7
    max_tokens: 4096
    api_key: "LLM_KEY_OPUS"
    base_url: "LLM_URL_OPUS"

  sonnet:
    model_name: "claude-3-5-sonnet-20241022"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_SONNET"
    base_url: "LLM_URL_SONNET"

  haiku:
    model_name: "claude-3-haiku-20240307"
    temperature: 0.0
    max_tokens: 1024
    api_key: "LLM_KEY_HAIKU"
    base_url: "LLM_URL_HAIKU"

# ============================================================
# 数据处理配置
# ============================================================

# PDF 解析配置
parser:
  input_dir: "data/raw"
  output_dir: "data/parsed"
  algorithm: "pymupdf4llm"
  pymupdf4llm:
    header: false
    footer: false
    page_separators: false     # Redundant when page_chunks=True; Layout mode auto-handles page breaks
    write_images: false        # Layout mode auto-classifies images; this controls not writing image files
    page_chunks: true          # Enable page-level output for page-aware chunking
    force_text: true           # Preserve text overlaid on charts (financial reports)
    ignore_code: true          # Avoid financial data tables being marked as code blocks
    use_ocr: true              # Keep OCR fallback for scanned pages
    ocr_language: "chi_sim+eng"  # Chinese + English OCR support
    show_progress: true        # Show parsing progress

# 分块配置
chunker:
  input_dir: "data/parsed"
  output_dir: "data/chunks"
  strategy: "fixed"          # Chunking strategy: "fixed" or "semantic"
  chunk_size: 512            # Max tokens per chunk
  chunk_overlap: 0           # Overlap tokens between chunks (fixed strategy)
  semantic:
    similarity_threshold: 0.5    # Cosine similarity threshold for breakpoints
    breakpoint_percentile: null  # Use percentile-based threshold (null = disabled)
    min_chunk_size: 100          # Minimum tokens per chunk

# 向量化配置
embedding:
  model_name: "BAAI/bge-large-zh-v1.5"
  device: "cuda"
  batch_size: 32
  query_instruction: null    # Instruction prefix for queries; null = auto-detect (BGE models use "为这个句子生成表示以用于检索相关文章：")

# 向量存储配置
vector_store:
  type: "qdrant"
  collection_name: "financial_reports"
  persist_dir: "data/vector_store"
  distance: "Cosine"

# 检索配置（基线：纯向量检索，高级功能通过实验配置开启）
retrieval:
  method: "vector"          # Retrieval method: "vector", "bm25", or "hybrid"
  top_k: 5
  score_threshold: 0        # Minimum similarity score to include (0 = no filtering; typical: 0.3-0.5)
  bm25:                     # BM25 参数（method=bm25 或 hybrid 时生效）
    k1: 1.5                 # BM25 term frequency saturation parameter
    b: 0.75                 # BM25 length normalization parameter
  hybrid:                   # 混合检索参数（method=hybrid 时生效）
    fusion: "rrf"           # Fusion strategy: "rrf" or "weighted"
    rrf_k: 60               # RRF constant (higher = dampen rank impact)
    vector_weight: 0.7      # Weight for vector scores in weighted fusion
    bm25_weight: 0.3        # Weight for BM25 scores in weighted fusion
  reranker:                 # 重排序（默认关闭，通过实验配置开启）
    enabled: false          # Enable cross-encoder reranking
    model_name: "BAAI/bge-reranker-large"  # Cross-encoder model
    device: "cuda"          # Reranker device
    top_n: 3                # Number of results to keep after reranking
  query_rewrite:            # 查询改写（默认关闭，通过实验配置开启）
    enabled: false          # Enable query rewriting
    strategy: "hyde"        # Strategy: "hyde" or "multi_query"
    num_queries: 3          # Number of sub-queries for multi_query strategy

# 生成配置（基线：使用硬编码默认 system prompt，通过实验配置覆盖）
generation:
  system_prompt: null       # Custom system prompt for the generator (null = use hardcoded default)

# ============================================================
# 实验管理配置
# ============================================================

# 实验相关配置：管理实验报告和配置文件
experiments:
  dir: "data/exp_reports"  # 实验报告存放目录
  configs_dir: "exp_configs"  # 实验配置文件目录

# ============================================================
# 数据管理配置
# ============================================================

# Meal 数据管理配置
meals:
  dir: "data/meals"
  collection_prefix: "m_"

# Artifacts 存储配置
artifacts:
  dir: "data/artifacts"

# LLM 评测器配置（用于 metrics 计算）
llm_evaluator:
  model_name: "LongCat-Flash-Lite"
  base_url: "https://api.longcat.chat/anthropic"
  extract_statements:
    temperature: 0.0
    max_tokens: 1024
  verify_statements:
    temperature: 0.0
    max_tokens: 1024
  faithfulness:
    temperature: 0.0
    max_tokens: 512
  answer_relevancy:
    temperature: 0.0
    max_tokens: 512
  context_precision:
    temperature: 0.0
    max_tokens: 256
  context_recall:
    temperature: 0.0
    max_tokens: 256
  context_relevance:
    temperature: 0.0
    max_tokens: 256
  infer_check:
    temperature: 0.0
    max_tokens: 64
  report_generation:
    model_name: "LongCat-Flash-Lite"
    temperature: 0.3
    max_tokens: 4096

# ============================================================
# 评测系统配置
# ============================================================

# 评测系统配置
evaluation:
  # 评测后端选择：["builtin"], ["ragas"], 或 ["builtin", "ragas"]
  backends: ["builtin"]
  
  # RAGAS 专用配置
  ragas:
    enabled: false
    llm_backend: "anthropic"        # 使用 LangChain Anthropic 接口（推荐）
    embeddings_backend: "local"     # 使用本地 BGE 或 "openai"
    max_tokens: 4096               # RAGAS 评测需要更大的 max_tokens（默认 LLM 的 1024 不够）
    run_config:
      max_workers: 5
      timeout: 120                # RAGAS 评测可能需要更长时间
      max_retries: 3

# ============================================================
# 测试与日志配置
# ============================================================

# 测试集生成配置
test_generation:
  default_strategy: "document"
  default_num_questions: 20
  max_retries: 3
  model_name: "LongCat-Flash-Lite"
  temperature: 0.7
  max_tokens: 1024
  supplement_max_tokens: 1024
  initial_max_tokens: 512
  document_level:
    enabled: true
    default_num_questions: 20
    type_distribution:
      single_fact: 0.30
      multi_fact: 0.25
      reasoning: 0.15
      comparative: 0.15
      missing: 0.10
      irrelevant: 0.05
    quality_control:
      enable_authenticity_check: true
      enable_llm_evaluation: false
      min_authenticity_score: 12
    max_retries: 3

# Token 成本配置：各模型的定价和折算系数
token_cost:
  models:
    LongCat-Flash-Lite:
      input_price_per_1k: 0.001
      output_price_per_1k: 0.002
      conversion_factor: 1.0
    claude-3-opus-20240229:
      input_price_per_1k: 0.015
      output_price_per_1k: 0.075
      conversion_factor: 15.0
    claude-3-5-sonnet-20241022:
      input_price_per_1k: 0.003
      output_price_per_1k: 0.015
      conversion_factor: 3.0
    claude-3-haiku-20240307:
      input_price_per_1k: 0.00025
      output_price_per_1k: 0.00125
      conversion_factor: 0.25

# 日志配置
logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  log_dir: "logs"
  rotation: "10 MB"
  retention: "7 days"
