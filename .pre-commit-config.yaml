# =============================================================================
# .pre-commit-config.yaml - pre-commit 钩子配置
# =============================================================================
#
# 【pre-commit 是什么？】
# pre-commit 是一个 Git 钩子管理器。它会在你每次 `git commit` 之前
# 自动运行你配置的检查脚本。如果检查不通过，commit 就会被阻止，
# 这样有问题的代码就不会进入代码库。
#
# 【类比理解】
# 就像提交作业前老师先检查一遍：
# - 格式不对 → 自动帮你改好（formatter）
# - 有明显错误 → 拦住你，让你改完再提交（linter）
# - 拼写/语法问题 → 提示你修复
#
# 【工作流程】
# 1. 你写完代码，执行 `git commit`
# 2. pre-commit 自动运行所有配置的钩子
# 3. 如果钩子修改了文件 → commit 失败，你需要 `git add` 修改后的文件再提交
# 4. 如果所有钩子都通过 → commit 成功
#
# 【首次安装】
#   pixi run pre-commit install
# 以后每次 commit 就会自动触发检查。
#
# 【手动运行（不 commit 也能检查）】
#   pixi run pre-commit run --all-files
#
# 【跳过钩子（紧急情况）】
#   git commit --no-verify -m "emergency fix"
#   注意：只在紧急情况使用，平时不要跳过！
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # Ruff：代码检查 + 自动格式化（本地版本，不连网）
  # ---------------------------------------------------------------------------
  # 这是最核心的钩子。它做两件事：
  # 1. ruff check --fix ：检查代码问题，能自动修的就修
  # 2. ruff format      ：格式化代码，统一风格
  #
  # 这里使用 repo: local，直接用 pixi 环境里的 ruff，
  # 不用从 GitHub 下载，速度快，不依赖网络。
  # 版本由 pixi.toml 控制（当前 >=0.11.0, <0.12）。
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: pixi run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formatter)
        entry: pixi run ruff format
        language: system
        types: [python]

  # ---------------------------------------------------------------------------
  # trailing-whitespace：删除行尾多余空格
  # ---------------------------------------------------------------------------
  # 行尾空格是"隐形垃圾"——你看不到它，但它确实存在，会造成：
  # - diff 噪音（git diff 里出现无意义的改动）
  # - 合并冲突（两个人都改了同一行的行尾空格）
  #
  # 这个钩子会自动删除所有行尾空格。
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace

      # ---------------------------------------------------------------------------
      # end-of-file-fixer：确保文件末尾有且仅有一个换行符
      # ---------------------------------------------------------------------------
      # POSIX 标准要求文本文件以换行符结尾。没有换行符的话：
      # - cat 命令会把两个文件的输出粘在一起
      # - 某些编辑器会自动加一个，造成无意义的 diff
      # ---------------------------------------------------------------------------
      - id: end-of-file-fixer
        name: fix end of files

      # ---------------------------------------------------------------------------
      # yaml 验证：检查 YAML 文件语法是否正确
      # ---------------------------------------------------------------------------
      # YAML 语法很容易出错（缩进、冒号后没空格等），
      # 这个钩子在 commit 前帮你验证，避免配置文件写错导致程序启动失败。
      # ---------------------------------------------------------------------------
      - id: check-yaml
        name: check yaml syntax
        exclude: "exp_configs/"

      # ---------------------------------------------------------------------------
      # merge-conflict：检测未解决的合并冲突标记
      # ---------------------------------------------------------------------------
      # 如果你合并代码后忘了处理冲突，文件里会留下 <<<<<<< HEAD 这样的标记，
      # 这个钩子会提醒你，防止把冲突标记提交到代码库。
      # ---------------------------------------------------------------------------
      - id: check-merge-conflict
        name: check merge conflicts

  # ---------------------------------------------------------------------------
  # post-merge-test：合并后自动跑单元测试
  # ---------------------------------------------------------------------------
  # 这个钩子跟上面那些不一样——上面的是 commit 前检查（防止坏代码提交），
  # 这个是 merge 后检查（确认合并后的代码整体没闯祸）。
  #
  # 【为什么需要它？】
  # 两个功能分支各自测试都通过，但合到一起可能出问题：
  # - 分支 A 改了 retriever.py 的接口
  # - 分支 B 还在用旧接口调用 retriever.py
  # - 各自 commit 时 lint/format 都通过（因为只检查格式，不跑测试）
  # - 合并后 pipeline 就炸了 💥
  #
  # 【工作流程】
  # 1. 你在 dev/main 分支执行 git merge feature-xxx
  # 2. 合并成功后，这个钩子自动触发
  # 3. 运行 pytest（跳过需要外部 API 的 integration 测试）
  # 4. ✅ 通过 → 一切正常，继续工作
  #    ❌ 失败 → 打印失败信息，你可以用 git reset --hard ORIG_HEAD 回滚
  #
  # 【关键参数解释】
  # - repo: local        → 不从远程下载，直接运行本地命令
  # - stages: [post-merge] → 只在 git merge 完成后触发，不影响 commit
  # - always_run: true   → 不管改了什么文件都跑测试（因为任何改动都可能影响全局）
  # - pass_filenames: false → pytest 不需要接收文件名参数
  #
  # 【手动运行测试】
  #   pixi run test-unit    → 纯单元测试（秒级反馈，开发中频繁使用）
  #   pixi run test          → 标准测试（跳过 integration 和 slow，~35s）
  #   pixi run test-all      → 全量测试（包括 integration 和 slow，~60s）
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: post-merge-test
        name: run tests after merge
        entry: pixi run test
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

# 全局排除：这些目录下的文件不会被任何钩子检查
exclude: |
  (?x)^(
    data/|
    \.pixi/|
    \.trae/|
    pixi\.lock
  )
