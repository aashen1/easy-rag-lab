name: "default_pipeline_eval"
description: "默认管线评估 — 6种管线 × 11个PDF（5%分层抽样 + bad case必选）"

pipelines:
  - name: "pymupdf4llm_pure"
    primary:
      algorithm: "pymupdf4llm"
      config:
        page_chunks: true
        header: false
        footer: false
        force_text: true
        ignore_code: true
        use_ocr: false
        clean_degenerate_tables: true
    table_enhancer: null

  - name: "pymupdf4llm_pdfplumber_lines"
    primary:
      algorithm: "pymupdf4llm"
      config:
        page_chunks: true
        header: false
        footer: false
        force_text: true
        ignore_code: true
        use_ocr: false
        clean_degenerate_tables: true
    table_enhancer:
      algorithm: "pdfplumber"
      config:
        strategy: "lines"
        vertical_strategy: "lines"
        horizontal_strategy: "lines"
        quality_filter:
          min_columns: 3
          max_empty_ratio: 0.5
          min_data_rows: 2
        replace_policy: "better_wins"

  - name: "pymupdf4llm_pdfplumber_text"
    primary:
      algorithm: "pymupdf4llm"
      config:
        page_chunks: true
        header: false
        footer: false
        force_text: true
        ignore_code: true
        use_ocr: false
        clean_degenerate_tables: true
    table_enhancer:
      algorithm: "pdfplumber"
      config:
        strategy: "text"
        vertical_strategy: "text"
        horizontal_strategy: "text"
        quality_filter:
          min_columns: 3
          max_empty_ratio: 0.5
          min_data_rows: 2
        replace_policy: "better_wins"

  - name: "fitz_pure"
    primary:
      algorithm: "fitz"
      config:
        header_filter: true
        footer_filter: true
        column_detection: true
        heading_detection: true
    table_enhancer: null

  - name: "fitz_pdfplumber_lines"
    primary:
      algorithm: "fitz"
      config:
        header_filter: true
        footer_filter: true
        column_detection: true
        heading_detection: true
    table_enhancer:
      algorithm: "pdfplumber"
      config:
        strategy: "lines"
        vertical_strategy: "lines"
        horizontal_strategy: "lines"
        quality_filter:
          min_columns: 3
          max_empty_ratio: 0.5
          min_data_rows: 2
        replace_policy: "better_wins"

  - name: "fitz_pdfplumber_text"
    primary:
      algorithm: "fitz"
      config:
        header_filter: true
        footer_filter: true
        column_detection: true
        heading_detection: true
    table_enhancer:
      algorithm: "pdfplumber"
      config:
        strategy: "text"
        vertical_strategy: "text"
        horizontal_strategy: "text"
        quality_filter:
          min_columns: 3
          max_empty_ratio: 0.5
          min_data_rows: 2
        replace_policy: "better_wins"

test_pdfs:
  - "data/raw/annual_reports/2023/比亚迪/2023年年度报告摘要.pdf"
  - "data/raw/annual_reports/2024/贵州茅台/贵州茅台2024年年度报告摘要.pdf"
  - "data/raw/annual_reports/2025/恒瑞医药/恒瑞医药2025年年度报告摘要.pdf"
  - "data/raw/annual_reports/2023/工商银行/工商银行2023年度报告摘要.pdf"
  - "data/raw/annual_reports/2024/隆基绿能/2024年年度报告摘要.pdf"
  - "data/raw/research_reports/2026年中国白酒行业信用观察.pdf"
  - "data/raw/research_reports/半导体行业3月份月报：AI算力驱动上游代工增长，GTC大会发布Vera Rubin AI计算平台.pdf"
  - "data/raw/research_reports/房地产行业第15周周报：新房、二手房成交同比增速均由正转负；上海首笔国企收购存量房转保租房贷款落地.pdf"
  - "data/raw/research_reports/煤炭行业周报：供需偏紧格局延续，煤价稳步上涨.pdf"
  - "data/raw/research_reports/军工行业周报：2026年中国国防预算增长7%.pdf"
  - "data/raw/research_reports/食品饮料行业ETF周报：茅台C端改革持续进行.pdf"

output_dir: "data/parser_reports"
