# =============================================================================
# pyproject.toml - Python 项目配置文件
# =============================================================================
#
# 【这是什么？】
# pyproject.toml 是 Python 项目的"中央配置文件"，由 PEP 518/621 标准定义。
# 它的作用类似于 Node.js 的 package.json 或 Rust 的 Cargo.toml：
# 把项目相关的工具配置集中在一个地方管理。
#
# 【为什么需要它？】
# 很多 Python 工具（如 ruff、pytest、mypy）都会自动读取这个文件中的配置，
# 而不需要你单独为每个工具写配置文件。这样项目根目录更干净。
#
# 【本项目的情况】
# 我们用 pixi 管理依赖（在 pixi.toml 中），所以这里只放工具配置，不放依赖。
# =============================================================================


# ---------------------------------------------------------------------------
# Ruff 配置
# ---------------------------------------------------------------------------
#
# 【Ruff 是什么？】
# Ruff 是一个用 Rust 编写的 Python 代码检查和格式化工具。
# 它的速度极快（比传统工具快 10-100 倍），而且一个工具就能替代多个老工具：
#
#   替代关系：
#   - flake8      → Ruff 的 linter 功能（检查代码错误和风格问题）
#   - black       → Ruff 的 formatter 功能（自动格式化代码）
#   - isort       → Ruff 的 isort 规则（自动排序 import 语句）
#   - pydocstyle  → Ruff 的 docstring 规则
#
# 【为什么选 Ruff 而不是分开用 flake8 + black + isort？】
# 1. 速度快：Ruff 用 Rust 写的，毫秒级完成检查，传统工具要好几秒
# 2. 配置简单：一个工具一份配置，不用协调多个工具的规则冲突
# 3. 社区活跃：Python 社区正在快速迁移到 Ruff（Django、FastAPI 等大项目已采用）
#
# 【日常使用】
# - `pixi run ruff check`          检查代码问题（不修改文件）
# - `pixi run ruff check --fix`    自动修复能修的问题
# - `pixi run ruff format`         格式化代码（会修改文件）
# - `pixi run lint`                同时跑 check + format（本项目快捷命令）
# ---------------------------------------------------------------------------

[tool.ruff]

# 目标 Python 版本 —— 告诉 Ruff 你的代码要兼容哪个 Python 版本，
# 这样它就不会建议你用该版本不支持的语法。
target-version = "py312"

# 每行最大字符数 —— 超过这个长度的行会被 formatter 自动折行。
# 88 是 black 的默认值，也是 Ruff 的默认值，是社区最广泛使用的标准。
line-length = 88

# 需要排除的目录 —— 这些目录下的文件不会被 Ruff 检查。
# data/     : 数据文件，不是 Python 代码
# .pixi/    : pixi 环境目录，第三方代码
# .trae/    : IDE 生成文件
extend-exclude = [
    "data",
    ".pixi",
    ".trae",
]


# ---------------------------------------------------------------------------
# Ruff Linter 规则配置
# ---------------------------------------------------------------------------
#
# 【Linter 是什么？】
# Linter（代码检查器）就像一个"语法+风格检查器"：
# - 它能发现真正的 bug（如用了未定义的变量）
# - 它能发现潜在问题（如导入了但没用的模块）
# - 它能统一代码风格（如函数名应该用 snake_case）
#
# 【规则选择策略】
# 初期我们选择宽松策略：只启用最基本、最有价值的规则，
# 避免一下子报几百个问题让人头疼。后续可以逐步收紧。
# ---------------------------------------------------------------------------

[tool.ruff.lint]

# 启用的规则集：
# - E    : pycodestyle 错误（Python 官方风格指南中的硬性规则）
# - W    : pycodestyle 警告（如行尾空格、空行过多等风格问题）
# - F    : pyflakes 错误（真正的代码错误，如未定义变量、重复导入）
# - I    : isort 规则（import 语句排序，让导入更整齐）
# - UP   : pyupgrade 规则（建议使用新版本 Python 的更优写法）
# - B    : flake8-bugbear 规则（常见 bug 模式检测）
# - SIM  : flake8-simplify 规则（代码简化建议）
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

# 忽略的规则（初期宽松策略）：
# - E501 : 行过长。我们的 formatter 会自动处理折行，不需要 linter 再报
# - B008 : 函数默认参数中调用函数。FastAPI 的 Depends() 常用这种模式
# - SIM108 : 建议用三元表达式替代 if-else。有时可读性更差，按需用 `# noqa: SIM108` 忽略
# - E402 : 模块级 import 不在文件顶部。sys.path.insert 后的 import 按需用 `# noqa: E402` 忽略
ignore = ["E501", "B008"]

# 每个文件的忽略规则 —— 对 __init__.py 放宽未使用导入的检查，
# 因为 __init__.py 经常只是为了重新导出模块的公共 API。
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"eval/run_experiment.py" = ["F401"]


# ---------------------------------------------------------------------------
# Ruff Formatter 配置
# ---------------------------------------------------------------------------
#
# 【Formatter 是什么？】
# Formatter（格式化器）自动调整代码的排版，比如缩进、空格、换行等。
# 它和 Linter 的区别是：
# - Linter  告诉你"这里有问题"（需要你或它来修）
# - Formatter 直接帮你改好（保存时自动格式化）
#
# 常见的 Formatter 对比：
# - black    : 最流行的 Python formatter，"不妥协"风格，几乎没有配置项
# - Ruff     : 兼容 black 的输出风格，但速度快 100 倍，且可配置
#
# 我们用 Ruff 的 formatter，效果和 black 一样，但更快。
# ---------------------------------------------------------------------------

[tool.ruff.format]

# 引号风格 —— 用双引号。这是 Python 社区的主流风格。
quote-style = "double"

# 缩进风格 —— 用 4 个空格。Python 官方推荐（PEP 8）。
indent-style = "space"


# ---------------------------------------------------------------------------
# pytest 配置
# ---------------------------------------------------------------------------
#
# 告诉 pytest 测试文件在哪里，以及哪些目录不需要搜索。
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: marks tests as pure unit tests (no external dependencies)",
    "integration: marks tests that touch external systems (Qdrant, LLM API, real PDF files)",
    "slow: marks tests as slow (heavy imports like torch/ragas, or execution time >5s)",
    "ui: marks tests for Streamlit AppTest UI smoke tests",
    "agent: marks tests for maintenance agent module",
]
addopts = "--basetemp=.pytest_tmp"
tmp_path_retention_count = 0
tmp_path_retention_policy = "failed"


# ---------------------------------------------------------------------------
# mutmut 配置
# ---------------------------------------------------------------------------
#
# 【mutmut 是什么？】
# 变异测试工具，用于检测"样子货测试"。
# 它会故意修改你的代码（比如把 > 改成 >=），然后跑测试。
# 如果测试通过了，说明测试没发现这个 bug → 测试质量有问题。
#
# 【src/ 布局兼容】
# 本项目使用 src/ 布局，mutmut 3.x 的 trampoline 机制会报错：
# "Module name starts with `src.`, which is invalid"
# 较老版本（2.x）有 use_patch=true 选项可以绕过，但 3.5.0 已移除该选项。
# 当前修复方式：tests/conftest.py 中的 monkey-patch 自动剥离 src. 前缀。
#
# 【变异范围限制（mutmut 3.5.0 已知问题）】
# `mutmut run <pattern>` 的参数只用于筛选测试哪些 mutant，不限定变异范围。
# paths_to_mutate 同时承担了"源码路径"和"变异范围"两个职责：
#   - 必须包含所有被测试引用的源码目录（否则测试跑不起来）
#   - 其中的每个 .py 都会被变异生成 mutant
# 所以无法做到"只变异 src/utils.py 但测试能导入 src/agent/ 等"。
#
# plgd/mutmut_docs.txt 描述的是 readthedocs 的 latest（main 分支）内容，
# 包含 only_mutate / source_paths 等未发布功能。当前 3.5.0 没有这些配置。
# 后续 mutmut 升级后可改用 only_mutate 实现按文件变异。
#
# 【日常使用】
#   pixi run mutmut run                          — 全量变异测试
#   pixi run mutmut run "utils.*"                — 只跑 utils 相关的 mutant（变异仍是全量）
#   pixi run mutmut run --max-children 1         — 限制并行数
#   pixi run mutmut results                      — 查看结果摘要
#   pixi run mutmut show <id>                    — 查看具体变异内容
#   pixi run mutmut browse                       — 交互界面
# ---------------------------------------------------------------------------

[tool.mutmut]
# 必须指定：要变异的源码路径
paths_to_mutate = ["src/", "scripts/", "eval/"]
# 可选：测试目录（帮助 mutmut 定位测试代码，避免变异测试本身）
tests_dir = ["tests"]
# 必须指定：运行测试的命令（返回非零=测试失败，零=测试通过）
runner = "pytest -x -q --tb=short -m 'not integration and not slow'"
# paths_to_mutate 指定的是需要被变异的源代码，
# 而 also_copy 指定的是不变异但运行测试必需的支撑文件。
also_copy = [
    "config.yaml",
    "main.py",
]

# # 可选：只变异有测试覆盖的代码（大幅加速，避免无效变异）
# # 需要先运行 coverage 生成 .coverage 文件
# use_coverage = true

# # 可选：字典同义词（用于 Dict/NamedTuple 等构造器的变异）
# dict_synonyms = ["Dict", "NamedTuple"]

# # 可选：排除特定文件/目录不变异（使用 gitignore 风格语法）
# exclude = ["*/migrations/*", "*/__init__.py"]



